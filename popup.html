<!DOCTYPE html>
<html>

<head>
  <style>
    body {
      width: 350px;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      padding: 15px;
      background-color: #f9f9f9;
    }

    h2 {
      margin-top: 0;
      color: #0056D2;
      /* Coursera Blue */
    }

    button {
      width: 100%;
      padding: 10px;
      background-color: #0056D2;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-size: 16px;
    }

    button:hover {
      background-color: #0041a3;
    }

    button:disabled {
      background-color: #ccc;
      cursor: default;
    }

    #log {
      margin-top: 15px;
      height: 200px;
      overflow-y: auto;
      background: white;
      border: 1px solid #ddd;
      padding: 10px;
      font-size: 12px;
      font-family: monospace;
      white-space: pre-wrap;
    }

    .status {
      margin-bottom: 10px;
      font-weight: bold;
    }
  </style>
</head>

<body>
  <h2>Coursera Skipper</h2>
  <div class="status" id="status">DoHung - 0586255568</div>
  <div style="display: flex; flex-direction: column; gap: 8px;">
    <div style="display: flex; gap: 10px;">
      <button id="startBtn">Skip videos</button>
      <button id="stopBtn" disabled style="background-color: #d93025;">Stop</button>
    </div>
    <button id="discussionBtn" style="background-color: #28a745;">Auto Discussion</button>
    <button id="doAssignmentBtn" style="background-color: #17a2b8;">Auto Do Peer Assignment </button>


    <div style="border: solid rgb(61, 84, 215) 2px; padding: 1px;">
      <button id="gradePeerBtn" style="background-color: #f39c12; margin-top: 4px;">Auto Grade Peer </button>
      <div
        style="display: flex; align-items: center; justify-content: space-between; background: #fff; padding: 8px 12px; border: 1px solid #eee; border-radius: 8px; margin: 5px 0;">
        <label for="gradeCount" style="font-size: 13px; color: #666; font-weight: 600;">Grade count:</label>
        <input type="number" id="gradeCount" value="3" min="1" max="50"
          style="width: 45px; padding: 6px; border: 1px solid #0056D2; border-radius: 6px; outline: none; font-weight: bold; color: #0056D2; text-align: center;">
      </div>
    </div>

    <div style="border: solid #8e44ad 2px; padding: 1px;">
      <div
        style="display: flex; flex-direction: column; gap: 5px; padding: 4px; background: #fff; border-radius: 4px; margin-bottom: 4px;">
        <label style="font-size: 13px; color: #666; font-weight: 600;">AI Integration:</label>
        <select id="aiProvider" style="padding: 6px; border: 1px solid #8e44ad; border-radius: 4px; outline: none;">
          <option value="gemini">Gemini API</option>
          <option value="openai">OpenAI API</option>
        </select>
        <input type="password" id="apiKey" placeholder="Enter API Key here..."
          style="padding: 6px; border: 1px solid #8e44ad; border-radius: 4px; outline: none;">
      </div>
      <button id="doQuizBtn" style="background-color: #8e44ad; margin-top: 2px;">Auto Do Quiz</button>
    </div>

  </div>
  <div id="log"></div>
  <script src="popup.js"></script>
</body>

</html>
